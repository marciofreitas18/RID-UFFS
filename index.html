<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Sistema RID - UFFS</title>

  <!-- CSS Bootstrap & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    :root {
      --verde-uffs: #00693E;
      --verde-uffs-escuro: #004D2D;
      --verde-uffs-claro: #e8f5e9;
    }
    body {
      background-color: #f4f6f7;
      font-family: Arial, sans-serif;
    }
    .uffs-header {
      background-color: var(--verde-uffs-escuro);
      color: #ffffff;
      border-bottom: 4px solid var(--verde-uffs);
    }
    .card-header-uffs {
      background-color: var(--verde-uffs);
      color: white;
      font-weight: bold;
    }
    .btn-uffs {
      background-color: var(--verde-uffs);
      color: white;
      border: none;
    }
    .btn-uffs:hover {
      background-color: var(--verde-uffs-escuro);
      color: white;
    }
    .badge-pontos {
      background-color: var(--verde-uffs-claro);
      color: var(--verde-uffs-escuro);
      border: 1px solid var(--verde-uffs);
    }
    .categoria-titulo {
      color: var(--verde-uffs-escuro);
      border-bottom: 2px solid var(--verde-uffs);
      padding-bottom: 5px;
      margin-top: 15px;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container-fluid bg-white p-0 shadow-sm rounded overflow-hidden" style="max-width: 1100px; margin: 0 auto;">
    
    <!-- CABEÇALHO INSTITUCIONAL -->
    <div class="uffs-header p-4 text-center">
      <h4 class="m-0 font-weight-bold">UNIVERSIDADE FEDERAL DA FRONTEIRA SUL - UFFS</h4>
      <p class="m-0 mt-1 text-light small">Relatório Individual Docente (RID) — Resolução Nº 239/CONSUNI/UFFS/2026</p>
    </div>

    <div class="p-4">
      
      <!-- DADOS DO DOCENTE -->
      <div class="card mb-4 border-light shadow-sm">
        <div class="card-header card-header-uffs">
          <i class="fas fa-user-id-card mr-2"></i>Dados do Docente
        </div>
        <div class="card-body bg-light">
          <div class="form-row">
            <div class="form-group col-md-6">
              <label class="font-weight-bold small">Nome Civil</label>
              <input type="text" id="nome_civil" class="form-control" placeholder="Seu nome completo">
            </div>
            <div class="form-group col-md-3">
              <label class="font-weight-bold small">SIAPE</label>
              <input type="text" id="siape" class="form-control" placeholder="1234567">
            </div>
            <div class="form-group col-md-3">
              <label class="font-weight-bold small">Lotação / Campus</label>
              <input type="text" id="lotacao" class="form-control" placeholder="Ex: Campus Chapecó">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label class="font-weight-bold small">Regime de Trabalho</label>
              <input type="text" id="regime" class="form-control" placeholder="Ex: Dedicação Exclusiva">
            </div>
            <div class="form-group col-md-4">
              <label class="font-weight-bold small">Período de Avaliação</label>
              <input type="text" id="periodo_avaliacao" class="form-control" placeholder="Ex: 2024/1 a 2025/2">
            </div>
            <div class="form-group col-md-4">
              <label class="font-weight-bold small">Data de Progressão</label>
              <input type="date" id="data_progressao" class="form-control">
            </div>
          </div>
        </div>
      </div>

      <!-- SEÇÕES DE ATIVIDADES CONTINUAS (SEM ABAS OCULTAS) -->
      
      <!-- 1. ENSINO -->

        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-ensino" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="1_1_1">[1.1.1.] Ministração de Componente Curricular na Graduação (2.5 pontos/15h)</option>
              <option value="1_1_2">[1.1.2.] Ministração de Componente Curricular na Pós-Graduação (2.5 pontos/15h)</option>
              <option value="1_2_1">[1.2.1.] Membro titular de colegiado de curso (2.0 pontos/semestre)</option>
              <option value="1_2_2">[1.2.2.] Membro suplente de colegiado de curso (1.0 pontos/semestre)</option>

              <option value="1_3_2">[1.3.2.] Orientação de Residência Médica (5.0 pontos/unidade)</option>
              <option value="1_3_3">[1.3.3.] Coorientação de TCC ou Residência Médica (2.0 pontos/unidade)</option>
              <option value="1_3_4">[1.3.4.] Orientação de estágio curricular obrigatório (2.0 pontos/estagiário)</option>
              <option value="1_3_5">[1.3.5.] Orientação de estágio curricular não obrigatório (1.0 pontos/estagiário)</option>
              <option value="1_3_6">[1.3.6.] Orientação de monitoria (3.0 pontos/projeto)</option>
              <option value="1_3_7">[1.3.7.] Orientação ou supervisão de PET, PIBID ou Residência Pedagógica (4.0 pontos/semestre)</option>
              <option value="1_3_8">[1.3.8.] Tutoria acadêmica (2.0 pontos/semestre)</option>
              <option value="1_4_1">[1.4.1.] Execução de palestra ou aula inaugural (2.0 pontos/palestra)</option>

            </select>

            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-ensino" class="form-control" min="0.1" step="any" placeholder="Ex: 60">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('ensino')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-ensino"></div>
      </div>

      <!-- 2. PESQUISA -->

      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-pesquisa" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="2_1_1">[2.1.1.] Coordenação de projeto de pesquisa institucionalizado (3.0 pontos/semestre)</option>

              <option value="2_4_1">[2.4.1.] Banca de defesa de Mestrado (3.0 pontos/banca)</option>
              <option value="2_4_2">[2.4.2.] Banca de defesa de Doutorado (5.0 pontos/banca)</option>
            </select>

            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-pesquisa" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('pesquisa')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-pesquisa"></div>
      </div>

      </div>

          </div>
        </div>

      </div>

      <!-- 5. GESTÃO -->

      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>

            <input type="number" id="qtd-gestao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('gestao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-gestao"></div>
      </div>

      <!-- BARRA DE PONTUAÇÃO E EMISSÃO DE PDF -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 p-3 badge-pontos rounded shadow-sm">
        <h5 class="m-0 mb-2 mb-md-0 font-weight-bold">Pontuação Total Final: <span id="pontuacao-total-geral" class="text-success">0.00</span> pts</h5>
        <button id="btn-gerar-pdf" class="btn btn-uffs btn-lg" onclick="gerarRIDOficialComBrasao()">
          <i class="fas fa-file-pdf mr-2"></i>Gerar RID Oficial + Comprovantes PDF
        </button>
      </div>

    </div>
  </div>

      { id: "3_1_2", cod: "3.1.2.", desc: "Colaboração em programa de extensão ou cultura", fator: 2.0, unit: "pontos/semestre", cat: "extensao" },
      { id: "3_1_3", cod: "3.1.3.", desc: "Coordenação de projeto de extensão ou cultura", fator: 3.0, unit: "pontos/semestre", cat: "extensao" },
      { id: "3_1_4", cod: "3.1.4.", desc: "Colaboração em projeto de extensão ou cultura", fator: 1.5, unit: "pontos/semestre", cat: "extensao" },
      { id: "3_2_1", cod: "3.2.1.", desc: "Orientação de bolsista ou voluntário de extensão", fator: 2.0, unit: "pontos/projeto", cat: "extensao" },
      { id: "3_3_1", cod: "3.3.1.", desc: "Produtos acadêmicos de extensão e cultura", fator: 1.0, unit: "pontos/unidade", cat: "extensao" },
      { id: "3_4_1", cod: "3.4.1.", desc: "Organização de evento de extensão", fator: 3.0, unit: "pontos/evento", cat: "extensao" },
      { id: "4_1_1", cod: "4.1.1.", desc: "Pós-graduação stricto sensu (com afastamento)", fator: 45.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_2", cod: "4.1.2.", desc: "Pós-graduação stricto sensu (sem afastamento)", fator: 28.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_3", cod: "4.1.3.", desc: "Estágio Pós-Doutoral (com afastamento)", fator: 45.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_4", cod: "4.1.4.", desc: "Estágio Pós-Doutoral (sem afastamento)", fator: 28.0, unit: "pontos/semestre", cat: "formacao" },

    ];

    let atividadesSelecionadas = [];

    window.onload = function() {
      renderizarTodasAsTabelas();
    };

    function adicionarAtividade(cat) {
      const select = document.getElementById(`select-${cat}`);
      const qtdInput = document.getElementById(`qtd-${cat}`);

      if (!select || !qtdInput) return;
      const itemId = select.value;
      const qtd = parseFloat(qtdInput.value);

      if (!itemId) { alert("Selecione uma atividade."); return; }
      if (isNaN(qtd) || qtd <= 0) { alert("Informe uma quantidade válida."); return; }

      const itemInfo = catalogoRID.find(i => i.id === itemId);
      if (!itemInfo) return;

      atividadesSelecionadas.push({
        uid: Date.now() + Math.random(),
        id: itemInfo.id,
        cod: itemInfo.cod,
        desc: itemInfo.desc,
        fator: itemInfo.fator,
        unit: itemInfo.unit,
        cat: itemInfo.cat,
        calc: itemInfo.calc,
        qtd: qtd,
        arquivoPDF: null
      });

      select.value = "";
      qtdInput.value = "";

      renderizarTabelaCategoria(cat);
      calcularTotais();
    }

    function removerAtividade(uid, cat) {
      atividadesSelecionadas = atividadesSelecionadas.filter(item => item.uid !== uid);
      renderizarTabelaCategoria(cat);
      calcularTotais();
    }

    function salvarComprovante(uid, inputElement) {
      const item = atividadesSelecionadas.find(i => i.uid === uid);
      if (item && inputElement.files && inputElement.files[0]) {
        item.arquivoPDF = inputElement.files[0];
      }
    }

    function renderizarTodasAsTabelas() {
      ["ensino", "pesquisa", "extensao", "formacao", "gestao"].forEach(cat => renderizarTabelaCategoria(cat));
    }

    function renderizarTabelaCategoria(cat) {
      const container = document.getElementById(`tabela-${cat}`);
      if (!container) return;

      const itens = atividadesSelecionadas.filter(i => i.cat === cat);

      if (itens.length === 0) {
        container.innerHTML = `<div class="alert alert-light text-center border text-muted my-2">Nenhuma atividade adicionada nesta categoria.</div>`;
        return;
      }

      let html = `
        <table class="table table-bordered table-sm table-hover mt-3 bg-white">
          <thead class="thead-light">
            <tr>
              <th style="width: 40%">Atividade</th>
              <th style="width: 15%">Fator</th>
              <th style="width: 10%">Qtd/Horas</th>
              <th style="width: 10%">Pontos</th>
              <th style="width: 15%">Comprovante PDF</th>
              <th style="width: 10%" class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
      `;

      itens.forEach(item => {
        let pontos = item.calc === "horas" ? (item.qtd / 15.0) * item.fator : item.qtd * item.fator;
        html += `
          <tr>
            <td><small><strong>${item.cod}</strong> ${item.desc}</small></td>
            <td><small class="text-muted">${item.fator} ${item.unit}</small></td>
            <td><strong>${item.qtd}</strong></td>
            <td><span class="font-weight-bold text-success">${pontos.toFixed(2)}</span></td>
            <td>
              <input type="file" class="form-control-file form-control-sm" accept="application/pdf" onchange="salvarComprovante(${item.uid}, this)">
            </td>
            <td class="text-center">
              <button class="btn btn-outline-danger btn-sm" onclick="removerAtividade(${item.uid}, '${cat}')" title="Excluir">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function calcularTotais() {
      let totalGeral = 0;
      atividadesSelecionadas.forEach(item => {
        let pontos = item.calc === "horas" ? (item.qtd / 15.0) * item.fator : item.qtd * item.fator;
        totalGeral += pontos;
      });
      const elGeral = document.getElementById("pontuacao-total-geral");
      if (elGeral) elGeral.innerText = totalGeral.toFixed(2);
    }

    async function gerarRIDOficialComBrasao() {
      alert("Função de PDF pronta para exportar com os anexos!");
    }
  </script>
