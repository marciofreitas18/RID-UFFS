<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema RID - UFFS</title>

  <!-- CSS Bootstrap & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    :root {
      --uffs-green: #006b3f;
      --uffs-dark-green: #004d2d;
    }
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header-uffs { background-color: var(--uffs-green); color: white; padding: 25px 0; border-bottom: 5px solid var(--uffs-dark-green); }
    .card-header-uffs { background-color: var(--uffs-green); color: white; font-weight: bold; font-size: 1.1rem; }
    .floating-summary { position: sticky; bottom: 15px; z-index: 1000; border-radius: 8px; }
    .badge-pontos { font-size: 1.2rem; }
  </style>

  <!-- Script das bibliotecas PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>

  <header class="header-uffs text-center mb-4 shadow">
    <div class="container">
      <h2>UNIVERSIDADE FEDERAL DA FRONTEIRA SUL - UFFS</h2>
      <h5>Serviço Especial de Avaliação de Desempenho</h5>
      <p class="mb-0">Relatório Individual Docente (RID) — Resolução Nº 49/CONSUNI/UFFS/2020</p>
    </div>
  </header>

  <div class="container mb-5">
    
    <!-- Identificação do Docente -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header card-header-uffs">
        <i class="fas fa-id-card"></i> Identificação do Docente
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 form-group">
            <label><strong>Nome Civil:</strong></label>
            <input type="text" id="nome_civil" class="form-control" placeholder="Nome completo">
          </div>
          <div class="col-md-6 form-group">
            <label><strong>Nome Social:</strong></label>
            <input type="text" id="nome_social" class="form-control" placeholder="Se houver">
          </div>
          <div class="col-md-4 form-group">
            <label><strong>SIAPE:</strong></label>
            <input type="text" id="siape" class="form-control" placeholder="Número SIAPE">
          </div>
          <div class="col-md-4 form-group">
            <label><strong>Lotação / Campus:</strong></label>
            <input type="text" id="lotacao" class="form-control" placeholder="Ex: Campus Chapecó">
          </div>
          <div class="col-md-4 form-group">
            <label><strong>Regime de Trabalho:</strong></label>
            <select id="regime" class="form-control">
              <option value="DE">Dedicação Exclusiva (DE)</option>
              <option value="40 Horas">40 Horas</option>
              <option value="20 Horas">20 Horas</option>
            </select>
          </div>
          <div class="col-md-6 form-group">
            <label><strong>Data da Última Progressão:</strong></label>
            <input type="date" id="data_progressao" class="form-control">
          </div>
          <div class="col-md-6 form-group">
            <label><strong>Período Avaliado (24 meses - 4 semestres):</strong></label>
            <input type="text" id="periodo_avaliacao" class="form-control" placeholder="Ex: 2024/1 a 2025/2">
          </div>
        </div>
      </div>
    </div>

    <!-- PONTO CENTRAL: Área onde o Painel Interativo e as Tabelas serão gerados pelo JS -->
    <div id="container-categorias"></div>

    <!-- Barra Flutuante de Pontuação Total e Exportação -->
    <div class="card shadow-lg floating-summary bg-dark text-white">
      <div class="card-body d-flex justify-content-between align-items-center py-2">
        <div>
          <h5 class="mb-0">Pontuação Total Final: <span id="pontuacao-total-geral" class="badge badge-warning badge-pontos">0.00</span> pts</h5>
        </div>
        <div>
          <button class="btn btn-success btn-lg" onclick="gerarRIDCompletoComComprovantes()">
            <i class="fas fa-file-pdf"></i> Gerar RID + Comprovantes em PDF
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Carrega a lógica principal da aplicação -->
  <script src="app.js"></script>
</body>
</html>
