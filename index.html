<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema RID - UFFS</title>
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-light p-4">

  <div class="container bg-white p-4 shadow-sm rounded">
    <h3 class="text-success mb-3">Relatório Individual Docente (RID) - UFFS</h3>

    <!-- DADOS DOCENTE -->
    <div class="card mb-4">
      <div class="card-header bg-secondary text-white">Dados do Docente</div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Nome Civil</label>
            <input type="text" id="nome_civil" class="form-control" placeholder="Seu nome completo">
          </div>
          <div class="form-group col-md-3">
            <label>SIAPE</label>
            <input type="text" id="siape" class="form-control" placeholder="1234567">
          </div>
          <div class="form-group col-md-3">
            <label>Lotação / Campus</label>
            <input type="text" id="lotacao" class="form-control" placeholder="Ex: Campus Chapecó">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-4">
            <label>Regime de Trabalho</label>
            <input type="text" id="regime" class="form-control" placeholder="Ex: Dedicação Exclusiva">
          </div>
          <div class="form-group col-md-4">
            <label>Período de Avaliação</label>
            <input type="text" id="periodo_avaliacao" class="form-control" placeholder="Ex: 2024/1 a 2025/2">
          </div>
          <div class="form-group col-md-4">
            <label>Data de Progressão</label>
            <input type="date" id="data_progressao" class="form-control">
          </div>
        </div>
      </div>
    </div>

    <!-- ABAS OU SEÇÕES DE CATEGORIAS -->
    <ul class="nav nav-tabs" id="ridTabs" role="tablist">
      <li class="nav-item"><a class="nav-link active" id="tab-ensino" data-toggle="tab" href="#sec-ensino">1. Ensino</a></li>
      <li class="nav-item"><a class="nav-link" id="tab-pesquisa" data-toggle="tab" href="#sec-pesquisa">2. Pesquisa</a></li>
      <li class="nav-item"><a class="nav-link" id="tab-extensao" data-toggle="tab" href="#sec-extensao">3. Extensão</a></li>
      <li class="nav-item"><a class="nav-link" id="tab-formacao" data-toggle="tab" href="#sec-formacao">4. Formação</a></li>
      <li class="nav-item"><a class="nav-link" id="tab-gestao" data-toggle="tab" href="#sec-gestao">5. Gestão</a></li>
    </ul>

    <div class="tab-content border border-top-0 p-3 bg-white" id="ridTabsContent">
      
      <!-- SEÇÃO ENSINO -->
      <div class="tab-pane fade show active" id="sec-ensino" role="tabpanel">
        <h5 class="mt-2 text-success">Atividades de Ensino</h5>
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label>Selecione a atividade:</label>
            <select id="select-ensino" class="form-control"></select>
          </div>
          <div class="form-group col-md-3">
            <label>Qtd / Horas:</label>
            <input type="number" id="qtd-ensino" class="form-control" min="0.1" step="any" placeholder="Ex: 60">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-primary btn-block" onclick="adicionarAtividade('ensino')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-ensino"></div>
      </div>

      <!-- SEÇÃO PESQUISA -->
      <div class="tab-pane fade" id="sec-pesquisa" role="tabpanel">
        <h5 class="mt-2 text-success">Atividades de Pesquisa</h5>
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label>Selecione a atividade:</label>
            <select id="select-pesquisa" class="form-control"></select>
          </div>
          <div class="form-group col-md-3">
            <label>Qtd / Horas:</label>
            <input type="number" id="qtd-pesquisa" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-primary btn-block" onclick="adicionarAtividade('pesquisa')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-pesquisa"></div>
      </div>

      <!-- SEÇÃO EXTENSÃO -->
      <div class="tab-pane fade" id="sec-extensao" role="tabpanel">
        <h5 class="mt-2 text-success">Atividades de Extensão</h5>
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label>Selecione a atividade:</label>
            <select id="select-extensao" class="form-control"></select>
          </div>
          <div class="form-group col-md-3">
            <label>Qtd / Horas:</label>
            <input type="number" id="qtd-extensao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-primary btn-block" onclick="adicionarAtividade('extensao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-extensao"></div>
      </div>

      <!-- SEÇÃO FORMAÇÃO -->
      <div class="tab-pane fade" id="sec-formacao" role="tabpanel">
        <h5 class="mt-2 text-success">Atividades de Formação</h5>
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label>Selecione a atividade:</label>
            <select id="select-formacao" class="form-control"></select>
          </div>
          <div class="form-group col-md-3">
            <label>Qtd / Horas:</label>
            <input type="number" id="qtd-formacao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-primary btn-block" onclick="adicionarAtividade('formacao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-formacao"></div>
      </div>

      <!-- SEÇÃO GESTÃO -->
      <div class="tab-pane fade" id="sec-gestao" role="tabpanel">
        <h5 class="mt-2 text-success">Atividades de Administração e Gestão</h5>
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label>Selecione a atividade:</label>
            <select id="select-gestao" class="form-control"></select>
          </div>
          <div class="form-group col-md-3">
            <label>Qtd / Horas:</label>
            <input type="number" id="qtd-gestao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-primary btn-block" onclick="adicionarAtividade('gestao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-gestao"></div>
      </div>

    </div>

    <!-- PONTUAÇÃO E BOTÃO PDF -->
    <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-light border rounded">
      <h4>Pontuação Total: <span id="pontuacao-total-geral" class="text-success font-weight-bold">0.00</span> pts</h4>
      <button id="btn-gerar-pdf" class="btn btn-success btn-lg" onclick="gerarRIDOficialComBrasao()">
        <i class="fas fa-file-pdf"></i> Gerar RID Oficial + Comprovantes PDF
      </button>
    </div>

  </div>

  <!-- BIBLIOTECAS JS (JQuery, Bootstrap, PDF-Lib e HTML2PDF) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- SEU ARQUIVO JAVASCRIPT -->
  <script src="script.js"></script>
</body>
</html>
