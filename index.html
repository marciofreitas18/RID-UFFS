<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema RID - UFFS</title>
  <!-- Bootstrap 4 (Layout UFFS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <style>
    :root {
      --uffs-green: #006b3f;
      --uffs-dark-green: #004d2d;
    }
    body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
    .header-uffs { background-color: var(--uffs-green); color: white; padding: 20px 0; border-bottom: 5px solid var(--uffs-dark-green); }
    .card-header-uffs { background-color: var(--uffs-green); color: white; font-weight: bold; }
    .subcat-title { background-color: #e9ecef; font-weight: bold; padding: 8px 12px; margin-top: 15px; border-left: 4px solid var(--uffs-green); }
    .table-sm td, .table-sm th { vertical-align: middle; }
    .badge-pontos { font-size: 1.1rem; }
    .floating-summary { position: sticky; bottom: 20px; z-index: 1000; }
  </style>

  <!-- Bibliotecas PDF (100% Client-Side) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>

  <header class="header-uffs text-center mb-4">
    <div class="container">
      <h2>UNIVERSIDADE FEDERAL DA FRONTEIRA SUL - UFFS</h2>
      <h4>Serviço Especial de Avaliação de Desempenho</h4>
      <p class="mb-0">Relatório Individual Docente (RID) - Anexo II da Resolução Nº 49/CONSUNI/UFFS/2020</p>
    </div>
  </header>

  <div class="container mb-5">
    
    <!-- Dados Cadastrais -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header card-header-uffs">
        <i class="fas fa-user-graduat"></i> Identificação do Docente
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 form-group">
            <label><strong>Nome Civil:</strong></label>
            <input type="text" id="nome_civil" class="form-control" placeholder="Nome completo">
          </div>
          <div class="col-md-6 form-group">
            <label><strong>Nome Social:</strong></label>
            <input type="text" id="nome_social" class="form-control" placeholder="Se houver">
          </div>
          <div class="col-md-4 form-group">
            <label><strong>SIAPE:</strong></label>
            <input type="text" id="siape" class="form-control" placeholder="Número SIAPE">
          </div>
          <div class="col-md-4 form-group">
            <label><strong>Lotação / Campus:</strong></label>
            <input type="text" id="lotacao" class="form-control" placeholder="Ex: Campus Chapecó">
          </div>
          <div class="col-md-4 form-group">
            <label><strong>Regime de Trabalho:</strong></label>
            <select id="regime" class="form-control">
              <option value="DE">Dedicação Exclusiva (DE)</option>
              <option value="40H">40 Horas</option>
              <option value="20H">20 Horas</option>
            </select>
          </div>
          <div class="col-md-6 form-group">
            <label><strong>Data da Última Progressão:</strong></label>
            <input type="date" id="data_progressao" class="form-control">
          </div>
          <div class="col-md-6 form-group">
            <label><strong>Período Avaliado (24 meses - 4 semestres):</strong></label>
            <input type="text" id="periodo_avaliacao" class="form-control" placeholder="Ex: 2024/1 a 2025/2">
          </div>
        </div>
      </div>
    </div>

    <!-- Formulário das Tabelas de Atividades -->
    <div id="container-categorias">
      <!-- As tabelas de Ensino, Pesquisa, Extensão, Formação e Gestão serão injetadas via app.js -->
    </div>

    <!-- Card de Resumo e Ações -->
    <div class="card shadow-lg floating-summary bg-dark text-white">
      <div class="card-body d-flex justify-content-between align-items-center py-2">
        <div>
          <h5 class="mb-0">Pontuação Total Final: <span id="pontuacao-total-geral" class="badge badge-warning badge-pontos">0.00</span> pts</h5>
        </div>
        <div>
          <button class="btn btn-success btn-lg" onclick="gerarRIDCompletoComComprovantes()">
            <i class="fas fa-file-pdf"></i> Gerar RID + Comprovantes em PDF
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
