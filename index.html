<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema RID - UFFS</title>

  <!-- CSS Bootstrap & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    :root {
      --verde-uffs: #00693E;
      --verde-uffs-escuro: #004D2D;
      --verde-uffs-claro: #e8f5e9;
    }
    body {
      background-color: #f4f6f7;
      font-family: Arial, sans-serif;
    }
    .uffs-header {
      background-color: var(--verde-uffs-escuro);
      color: #ffffff;
      border-bottom: 4px solid var(--verde-uffs);
    }
    .card-header-uffs {
      background-color: var(--verde-uffs);
      color: white;
      font-weight: bold;
    }
    .btn-uffs {
      background-color: var(--verde-uffs);
      color: white;
      border: none;
    }
    .btn-uffs:hover {
      background-color: var(--verde-uffs-escuro);
      color: white;
    }
    .badge-pontos {
      background-color: var(--verde-uffs-claro);
      color: var(--verde-uffs-escuro);
      border: 1px solid var(--verde-uffs);
    }
    .categoria-titulo {
      color: var(--verde-uffs-escuro);
      border-bottom: 2px solid var(--verde-uffs);
      padding-bottom: 5px;
      margin-top: 15px;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container-fluid bg-white p-0 shadow-sm rounded overflow-hidden" style="max-width: 1100px; margin: 0 auto;">
    
    <!-- CABEÇALHO INSTITUCIONAL -->
    <div class="uffs-header p-4 text-center">
      <h4 class="m-0 font-weight-bold">UNIVERSIDADE FEDERAL DA FRONTEIRA SUL - UFFS</h4>
      <p class="m-0 mt-1 text-light small">Relatório Individual Docente (RID)</p>
    </div>

    <div class="p-4">
      
      <!-- DADOS DO DOCENTE -->
      <div class="card mb-4 border-light shadow-sm">
        <div class="card-header card-header-uffs">
          <i class="fas fa-user-id-card mr-2"></i>Dados do Docente
        </div>
        <div class="card-body bg-light">
          <div class="form-row">
            <div class="form-group col-md-6">
              <label class="font-weight-bold small">Nome Civil</label>
              <input type="text" id="nome_civil" class="form-control" placeholder="Seu nome completo">
            </div>
            <div class="form-group col-md-3">
              <label class="font-weight-bold small">SIAPE</label>
              <input type="text" id="siape" class="form-control" placeholder="1234567">
            </div>
            <div class="form-group col-md-3">
              <label class="font-weight-bold small">Lotação / Campus</label>
              <input type="text" id="lotacao" class="form-control" placeholder="Ex: Campus Chapecó">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label class="font-weight-bold small">Regime de Trabalho</label>
              <input type="text" id="regime" class="form-control" placeholder="Ex: Dedicação Exclusiva">
            </div>
            <div class="form-group col-md-4">
              <label class="font-weight-bold small">Período de Avaliação</label>
              <input type="text" id="periodo_avaliacao" class="form-control" placeholder="Ex: 2024/1 a 2025/2">
            </div>
            <div class="form-group col-md-4">
              <label class="font-weight-bold small">Data de Progressão</label>
              <input type="date" id="data_progressao" class="form-control">
            </div>
          </div>
        </div>
      </div>

      <!-- SEÇÕES DE ATIVIDADES CONTINUAS -->
      
      <!-- 1. ENSINO -->
      <h5 class="categoria-titulo"><i class="fas fa-chalkboard-teacher mr-2"></i>1. Atividades de Ensino</h5>
      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-ensino" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="1_1_1">[1.1.1.] Ministração de Componente Curricular na Graduação (2.5 pontos/15h)</option>
              <option value="1_1_2">[1.1.2.] Ministração de Componente Curricular na Pós-Graduação (2.5 pontos/15h)</option>
              <option value="1_2_1">[1.2.1.] Membro titular de colegiado de curso (2.0 pontos/semestre)</option>
              <option value="1_2_2">[1.2.2.] Membro suplente de colegiado de curso (1.0 pontos/semestre)</option>
              <option value="1_2_3">[1.2.3.] Membro do Núcleo Docente Estruturante (NDE) (2.0 pontos/semestre)</option>
              <option value="1_2_4">[1.2.4.] Membro de fóruns de ensino (1.0 pontos/semestre)</option>
              <option value="1_2_5">[1.2.5.] Membro de outras comissões ligadas ao ensino (0.5 pontos/semestre)</option>
              <option value="1_2_6">[1.2.6.] Coordenação de estágios (5.0 pontos/semestre)</option>
              <option value="1_3_1">[1.3.1.] Orientação de trabalho de conclusão de curso (TCC) (4.0 pontos/TCC)</option>
              <option value="1_3_2">[1.3.2.] Orientação de Residência Médica (5.0 pontos/unidade)</option>
              <option value="1_3_3">[1.3.3.] Coorientação de TCC ou Residência Médica (2.0 pontos/unidade)</option>
              <option value="1_3_4">[1.3.4.] Orientação de estágio curricular obrigatório (2.0 pontos/estagiário)</option>
              <option value="1_3_5">[1.3.5.] Orientação de estágio curricular não obrigatório (1.0 pontos/estagiário)</option>
              <option value="1_3_6">[1.3.6.] Orientação de monitoria (3.0 pontos/projeto)</option>
              <option value="1_3_7">[1.3.7.] Orientação ou supervisão de PET, PIBID ou Residência Pedagógica (4.0 pontos/semestre)</option>
              <option value="1_3_8">[1.3.8.] Tutoria acadêmica (2.0 pontos/semestre)</option>
              <option value="1_4_1">[1.4.1.] Execução de palestra ou aula inaugural (2.0 pontos/palestra)</option>
              <option value="1_4_2">[1.4.2.] Participação em banca de TCC de Graduação (1.5 pontos/banca)</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-ensino" class="form-control" min="0.1" step="any" placeholder="Ex: 60">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('ensino')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-ensino"></div>
      </div>

      <!-- 2. PESQUISA -->
      <h5 class="categoria-titulo"><i class="fas fa-microscope mr-2"></i>2. Atividades de Pesquisa</h5>
      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-pesquisa" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="2_1_1">[2.1.1.] Coordenação de projeto de pesquisa institucionalizado (3.0 pontos/semestre)</option>
              <option value="2_1_2">[2.1.2.] Colaboração em projeto de pesquisa institucionalizado (1.5 pontos/semestre)</option>
              <option value="2_1_3">[2.1.3.] Coordenação de grupo de pesquisa cadastrado no CNPq (2.0 pontos/semestre)</option>
              <option value="2_2_1">[2.2.1.] Orientação de dissertação de mestrado concluída (10.0 pontos/dissertação)</option>
              <option value="2_2_2">[2.2.2.] Orientação de tese de doutorado concluída (15.0 pontos/tese)</option>
              <option value="2_2_3">[2.2.3.] Orientação em andamento de Mestrado (4.0 pontos/semestre)</option>
              <option value="2_2_4">[2.2.4.] Orientação em andamento de Doutorado (6.0 pontos/semestre)</option>
              <option value="2_2_5">[2.2.5.] Orientação de Iniciação Científica (IC/IT) (3.0 pontos/projeto)</option>
              <option value="2_3_1">[2.3.1.] Publicação de artigo científico Qualis A (15.0 pontos/artigo)</option>
              <option value="2_3_2">[2.3.2.] Publicação de artigo científico Qualis B (10.0 pontos/artigo)</option>
              <option value="2_3_3">[2.3.3.] Publicação de livro autoral com conselho editorial (20.0 pontos/livro)</option>
              <option value="2_3_4">[2.3.4.] Publicação de capítulo de livro (5.0 pontos/capítulo)</option>
              <option value="2_4_1">[2.4.1.] Banca de defesa de Mestrado (3.0 pontos/banca)</option>
              <option value="2_4_2">[2.4.2.] Banca de defesa de Doutorado (5.0 pontos/banca)</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-pesquisa" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('pesquisa')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-pesquisa"></div>
      </div>

      <!-- 3. EXTENSÃO -->
      <h5 class="categoria-titulo"><i class="fas fa-hands-helping mr-2"></i>3. Atividades de Extensão</h5>
      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-extensao" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="3_1_1">[3.1.1.] Coordenação de programa de extensão ou cultura (4.0 pontos/semestre)</option>
              <option value="3_1_2">[3.1.2.] Colaboração em programa de extensão ou cultura (2.0 pontos/semestre)</option>
              <option value="3_1_3">[3.1.3.] Coordenação de projeto de extensão ou cultura (3.0 pontos/semestre)</option>
              <option value="3_1_4">[3.1.4.] Colaboração em projeto de extensão ou cultura (1.5 pontos/semestre)</option>
              <option value="3_2_1">[3.2.1.] Orientação de bolsista ou voluntário de extensão (2.0 pontos/projeto)</option>
              <option value="3_3_1">[3.3.1.] Produtos acadêmicos de extensão e cultura (1.0 pontos/unidade)</option>
              <option value="3_4_1">[3.4.1.] Organização de evento de extensão (3.0 pontos/evento)</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-extensao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('extensao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-extensao"></div>
      </div>

      <!-- 4. FORMAÇÃO -->
      <h5 class="categoria-titulo"><i class="fas fa-user-graduate mr-2"></i>4. Atividades de Formação</h5>
      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-formacao" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="4_1_1">[4.1.1.] Pós-graduação stricto sensu (com afastamento) (45.0 pontos/semestre)</option>
              <option value="4_1_2">[4.1.2.] Pós-graduação stricto sensu (sem afastamento) (28.0 pontos/semestre)</option>
              <option value="4_1_3">[4.1.3.] Estágio Pós-Doutoral (com afastamento) (45.0 pontos/semestre)</option>
              <option value="4_1_4">[4.1.4.] Estágio Pós-Doutoral (sem afastamento) (28.0 pontos/semestre)</option>
              <option value="4_1_5">[4.1.5.] Cursos de formação continuada (mínimo 20h) (1.0 pontos/curso)</option>
              <option value="4_1_6">[4.1.6.] Participação em cursos de formação docente UFFS (2.0 pontos/curso)</option>
            </select>

            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-formacao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('formacao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-formacao"></div>
      </div>

      <!-- 5. GESTÃO -->
      <h5 class="categoria-titulo"><i class="fas fa-tasks mr-2"></i>5. Atividades de Gestão</h5>
      <div class="card card-body bg-light mb-4">
        <div class="form-row align-items-end">
          <div class="form-group col-md-7">
            <label class="small font-weight-bold">Selecione a atividade:</label>
            <select id="select-gestao" class="form-control">
              <option value="">-- Selecione uma atividade --</option>
              <option value="5_1_1">[5.1.1.] Reitor, Vice-Reitor, Pró-Reitor ou Diretor de Campus (45.0 pontos/semestre)</option>
              <option value="5_1_2">[5.1.2.] Secretário Especial ou Superintendente (40.0 pontos/semestre)</option>
              <option value="5_1_3">[5.1.3.] Pró-Reitor Adjunto ou Diretor de Assessoria/Secretaria (35.0 pontos/semestre)</option>
              <option value="5_1_7">[5.1.7.] Coordenador de curso de graduação ou pós-graduação (30.0 pontos/semestre)</option>
              <option value="5_1_8">[5.1.8.] Coordenador adjunto ou de subárea de programa acadêmico (15.0 pontos/semestre)</option>
              <option value="5_1_12">[5.1.12.] Membro de comissão instituída por ato administrativo (5.0 pontos/semestre)</option>
              <option value="5_1_13">[5.1.13.] Membro do CONSUNI ou CÂMARAS FONTES (5.0 pontos/semestre)</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label class="small font-weight-bold">Qtd / Horas:</label>
            <input type="number" id="qtd-gestao" class="form-control" min="0.1" step="any" placeholder="Ex: 1">
          </div>
          <div class="form-group col-md-2">
            <button class="btn btn-uffs btn-block" onclick="adicionarAtividade('gestao')"><i class="fas fa-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="tabela-gestao"></div>
      </div>

      <!-- BARRA DE PONTUAÇÃO E EMISSÃO DE PDF -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 p-3 badge-pontos rounded shadow-sm">
        <h5 class="m-0 mb-2 mb-md-0 font-weight-bold">Pontuação Total Final: <span id="pontuacao-total-geral" class="text-success">0.00</span> pts</h5>
        <button id="btn-gerar-pdf" class="btn btn-uffs btn-lg" onclick="gerarRIDOficialComBrasao()">
          <i class="fas fa-file-pdf mr-2"></i>Gerar RID Oficial + Comprovantes PDF
        </button>
      </div>

    </div>
  </div>

      { id: "3_1_2", cod: "3.1.2.", desc: "Colaboração em programa de extensão ou cultura", fator: 2.0, unit: "pontos/semestre", cat: "extensao" },
      { id: "3_1_3", cod: "3.1.3.", desc: "Coordenação de projeto de extensão ou cultura", fator: 3.0, unit: "pontos/semestre", cat: "extensao" },
      { id: "3_1_4", cod: "3.1.4.", desc: "Colaboração em projeto de extensão ou cultura", fator: 1.5, unit: "pontos/semestre", cat: "extensao" },
      { id: "3_2_1", cod: "3.2.1.", desc: "Orientação de bolsista ou voluntário de extensão", fator: 2.0, unit: "pontos/projeto", cat: "extensao" },
      { id: "3_3_1", cod: "3.3.1.", desc: "Produtos acadêmicos de extensão e cultura", fator: 1.0, unit: "pontos/unidade", cat: "extensao" },
      { id: "3_4_1", cod: "3.4.1.", desc: "Organização de evento de extensão", fator: 3.0, unit: "pontos/evento", cat: "extensao" },
      { id: "4_1_1", cod: "4.1.1.", desc: "Pós-graduação stricto sensu (com afastamento)", fator: 45.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_2", cod: "4.1.2.", desc: "Pós-graduação stricto sensu (sem afastamento)", fator: 28.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_3", cod: "4.1.3.", desc: "Estágio Pós-Doutoral (com afastamento)", fator: 45.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_4", cod: "4.1.4.", desc: "Estágio Pós-Doutoral (sem afastamento)", fator: 28.0, unit: "pontos/semestre", cat: "formacao" },
      { id: "4_1_5", cod: "4.1.5.", desc: "Cursos de formação continuada (mínimo 20h)", fator: 1.0, unit: "pontos/curso", cat: "formacao" },
      { id: "4_1_6", cod: "4.1.6.", desc: "Participação em cursos de formação docente UFFS", fator: 2.0, unit: "pontos/curso", cat: "formacao" },
      { id: "5_1_1", cod: "5.1.1.", desc: "Reitor, Vice-Reitor, Pró-Reitor ou Diretor de Campus", fator: 45.0, unit: "pontos/semestre", cat: "gestao" },
      { id: "5_1_2", cod: "5.1.2.", desc: "Secretário Especial ou Superintendente", fator: 40.0, unit: "pontos/semestre", cat: "gestao" },
      { id: "5_1_3", cod: "5.1.3.", desc: "Pró-Reitor Adjunto ou Diretor de Assessoria/Secretaria", fator: 35.0, unit: "pontos/semestre", cat: "gestao" },
      { id: "5_1_7", cod: "5.1.7.", desc: "Coordenador de curso de graduação ou pós-graduação", fator: 30.0, unit: "pontos/semestre", cat: "gestao" },
      { id: "5_1_8", cod: "5.1.8.", desc: "Coordenador adjunto ou de subárea de programa acadêmico", fator: 15.0, unit: "pontos/semestre", cat: "gestao" },
      { id: "5_1_12", cod: "5.1.12.", desc: "Membro de comissão instituída por ato administrativo", fator: 5.0, unit: "pontos/semestre", cat: "gestao" },
      { id: "5_1_13", cod: "5.1.13.", desc: "Membro do CONSUNI ou CÂMARAS FONTES", fator: 5.0, unit: "pontos/semestre", cat: "gestao" }
    ];

    let atividadesSelecionadas = [];

    window.onload = function() {
      renderizarTodasAsTabelas();
    };

    function adicionarAtividade(cat) {
      const select = document.getElementById(`select-${cat}`);
      const qtdInput = document.getElementById(`qtd-${cat}`);

      if (!select || !qtdInput) return;
      const itemId = select.value;
      const qtd = parseFloat(qtdInput.value);

      if (!itemId) { alert("Selecione uma atividade."); return; }
      if (isNaN(qtd) || qtd <= 0) { alert("Informe uma quantidade válida."); return; }

      const itemInfo = catalogoRID.find(i => i.id === itemId);
      if (!itemInfo) return;

      atividadesSelecionadas.push({
        uid: Date.now() + Math.random(),
        id: itemInfo.id,
        cod: itemInfo.cod,
        desc: itemInfo.desc,
        fator: itemInfo.fator,
        unit: itemInfo.unit,
        cat: itemInfo.cat,
        calc: itemInfo.calc,
        qtd: qtd,
        arquivoPDF: null
      });

      select.value = "";
      qtdInput.value = "";

      renderizarTabelaCategoria(cat);
      calcularTotais();
    }

    function removerAtividade(uid, cat) {
      atividadesSelecionadas = atividadesSelecionadas.filter(item => item.uid !== uid);
      renderizarTabelaCategoria(cat);
      calcularTotais();
    }

    function salvarComprovante(uid, inputElement) {
      const item = atividadesSelecionadas.find(i => i.uid === uid);
      if (item && inputElement.files && inputElement.files[0]) {
        item.arquivoPDF = inputElement.files[0];
      }
    }

    function renderizarTodasAsTabelas() {
      ["ensino", "pesquisa", "extensao", "formacao", "gestao"].forEach(cat => renderizarTabelaCategoria(cat));
    }

    function compararCodigos(codA, codB) {
      const a = codA.replace(/\.$/, '').split('.').map(Number);
      const b = codB.replace(/\.$/, '').split('.').map(Number);
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        const valA = a[i] || 0;
        const valB = b[i] || 0;
        if (valA !== valB) return valA - valB;
      }
      return 0;
    }

    function renderizarTabelaCategoria(cat) {
      const container = document.getElementById(`tabela-${cat}`);
      if (!container) return;

      const itens = atividadesSelecionadas.filter(i => i.cat === cat).sort((a, b) => compararCodigos(a.cod, b.cod));

      if (itens.length === 0) {
        container.innerHTML = `<div class="alert alert-light text-center border text-muted my-2">Nenhuma atividade adicionada nesta categoria.</div>`;
        return;
      }

      let html = `
        <table class="table table-bordered table-sm table-hover mt-3 bg-white">
          <thead class="thead-light">
            <tr>
              <th style="width: 40%">Atividade</th>
              <th style="width: 15%">Fator</th>
              <th style="width: 10%">Qtd/Horas</th>
              <th style="width: 10%">Pontos</th>
              <th style="width: 15%">Comprovante PDF</th>
              <th style="width: 10%" class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
      `;

      itens.forEach(item => {
        let pontos = item.calc === "horas" ? (item.qtd / 15.0) * item.fator : item.qtd * item.fator;
        html += `
          <tr>
            <td><small><strong>${item.cod}</strong> ${item.desc}</small></td>
            <td><small class="text-muted">${item.fator} ${item.unit}</small></td>
            <td><strong>${item.qtd}</strong></td>
            <td><span class="font-weight-bold text-success">${pontos.toFixed(2)}</span></td>
            <td>
              <input type="file" class="form-control-file form-control-sm" accept="application/pdf" onchange="salvarComprovante(${item.uid}, this)">
            </td>
            <td class="text-center">
              <button class="btn btn-outline-danger btn-sm" onclick="removerAtividade(${item.uid}, '${cat}')" title="Excluir">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function calcularTotais() {
      let totalGeral = 0;
      atividadesSelecionadas.forEach(item => {
        let pontos = item.calc === "horas" ? (item.qtd / 15.0) * item.fator : item.qtd * item.fator;
        totalGeral += pontos;
      });
      const elGeral = document.getElementById("pontuacao-total-geral");
      if (elGeral) elGeral.innerText = totalGeral.toFixed(2);
    }

    async function gerarRIDOficialComBrasao() {
      if (atividadesSelecionadas.length === 0) {
        alert("Adicione pelo menos uma atividade antes de gerar o relatório!");
        return;
      }

      const btn = document.getElementById("btn-gerar-pdf");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Processando PDF...`;
      }

      let ridElement = null;

      try {
        const { PDFDocument } = PDFLib;
        const pdfFinal = await PDFDocument.create();

        const nomeDocente = document.getElementById("nome_civil")?.value || "Docente";
        const siape = document.getElementById("siape")?.value || "---";

        let paginaAtual = 2;
        const itensComPagina = [];

        const atividadesOrdenadas = [...atividadesSelecionadas].sort((a, b) => compararCodigos(a.cod, b.cod));

        for (const item of atividadesOrdenadas) {
          let numPaginasAnexo = 0;
          let paginaInicio = "Sem comprovante";

          if (item.arquivoPDF) {
            const fileBuffer = await item.arquivoPDF.arrayBuffer();
            try {
              const docAnexoTemp = await PDFDocument.load(fileBuffer);
              numPaginasAnexo = docAnexoTemp.getPageCount();
              paginaInicio = `Página ${paginaAtual}` + (numPaginasAnexo > 1 ? ` a ${paginaAtual + numPaginasAnexo - 1}` : '');
              paginaAtual += numPaginasAnexo;
            } catch (e) {
              paginaInicio = "Erro ao ler arquivo";
            }
          }

          itensComPagina.push({ ...item, paginaInfo: paginaInicio });
        }

        // Criamos o container visível momentaneamente para renderização completa sem telas brancas
        ridElement = document.createElement("div");
        ridElement.style.position = "absolute";
        ridElement.style.left = "0";
        ridElement.style.top = "0";
        ridElement.style.width = "750px";
        ridElement.style.padding = "20px";
        ridElement.style.margin = "0 auto";
        ridElement.style.boxSizing = "border-box";
        ridElement.style.fontFamily = "Arial, sans-serif";
        ridElement.style.fontSize = "10px";
        ridElement.style.color = "#333";
        ridElement.style.backgroundColor = "#fff";
        ridElement.style.zIndex = "-9999";

        const gruposOficiais = [
          { key: "ensino", titulo: "1. ATIVIDADES DE ENSINO" },
          { key: "pesquisa", titulo: "2. ATIVIDADES DE PESQUISA" },
          { key: "extensao", titulo: "3. ATIVIDADES DE EXTENSÃO" },
          { key: "formacao", titulo: "4. ATIVIDADES DE FORMAÇÃO" },
          { key: "gestao", titulo: "5. ATIVIDADES DE ADMINISTRAÇÃO E GESTÃO UNIVERSITÁRIA" }
        ];

        let tabelasGruposHtml = "";

        gruposOficiais.forEach(grupo => {
          const itensDoGrupo = itensComPagina.filter(i => i.cat === grupo.key);
          let subtotalGrupo = 0;

          tabelasGruposHtml += `
            <div style="margin-top: 10px; page-break-inside: avoid;">
              <h4 style="background:#00693E; color:white; padding:4px 8px; margin:0 0 6px 0; font-size:11px; font-weight:bold; border-radius:2px;">
                ${grupo.titulo}
              </h4>
          `;

          if (itensDoGrupo.length === 0) {
            tabelasGruposHtml += `<p style="font-style:italic; color:#777; margin:2px 0 8px 5px; font-size:9.5px;">Nenhuma atividade declarada neste grupo.</p>`;
          } else {
            tabelasGruposHtml += `
              <table style="width:100%; border-collapse:collapse; margin-bottom:4px; font-size:9.5px; table-layout: fixed;">
                <thead>
                  <tr style="background:#f2f4f5;">
                    <th style="border:1px solid #bbb; padding:4px; text-align:left; width:52%;">Código / Descrição da Atividade</th>
                    <th style="border:1px solid #bbb; padding:4px; text-align:center; width:12%;">Qtd/Horas</th>
                    <th style="border:1px solid #bbb; padding:4px; text-align:center; width:12%;">Pontos</th>
                    <th style="border:1px solid #bbb; padding:4px; text-align:center; width:24%;">Localização Comprovante</th>
                  </tr>
                </thead>
                <tbody>
            `;

            itensDoGrupo.forEach(item => {
              let pts = item.calc === "horas" ? (item.qtd / 15.0) * item.fator : item.qtd * item.fator;
              subtotalGrupo += pts;

              tabelasGruposHtml += `
                <tr style="page-break-inside: avoid;">
                  <td style="border:1px solid #bbb; padding:4px; word-wrap:break-word;"><strong>${item.cod}</strong> ${item.desc}</td>
                  <td style="border:1px solid #bbb; padding:4px; text-align:center;">${item.qtd}</td>
                  <td style="border:1px solid #bbb; padding:4px; text-align:center; font-weight:bold; color:#00693E;">${pts.toFixed(2)}</td>
                  <td style="border:1px solid #bbb; padding:4px; text-align:center; color:#444; font-size:9px;">${item.paginaInfo}</td>
                </tr>
              `;
            });

            tabelasGruposHtml += `
                </tbody>
              </table>
              <div style="text-align:right; font-weight:bold; margin-bottom:10px; font-size:10px;">
                Subtotal ${grupo.titulo}: <span style="color:#00693E;">${subtotalGrupo.toFixed(2)} pts</span>
              </div>
            `;
          }

          tabelasGruposHtml += `</div>`;
        });

        // Utilização de um SVG inline vetorial do Brasão para evitar bloqueio de arquivos locais
        const brasaoSvg = `
          <svg width="50" height="50" viewBox="0 0 100 100" style="margin: 0 auto 5px auto; display: block;">
            <circle cx="50" cy="50" r="45" fill="#00693E" />
            <polygon points="50,15 61,38 85,38 66,52 73,76 50,60 27,76 34,52 15,38 39,38" fill="#FFCC00" />
            <circle cx="50" cy="50" r="12" fill="#002776" />
          </svg>
        `;

        ridElement.innerHTML = `
          <div style="text-align:center; margin:0 0 10px 0; padding:0;">
            ${brasaoSvg}
            <h3 style="margin:0; color:#004D2D; font-size:12px; font-weight:bold; text-transform:uppercase; line-height:1.2;">República Federativa do Brasil</h3>
            <h4 style="margin:2px 0 0 0; color:#00693E; font-size:11px; font-weight:bold; text-transform:uppercase; line-height:1.2;">Universidade Federal da Fronteira Sul - UFFS</h4>
            <h5 style="margin:4px 0 0 0; font-size:10px; font-weight:bold; color:#333; line-height:1.2;">RELATÓRIO INDIVIDUAL DOCENTE (RID) — RESOLUÇÃO 239/CONSUNI/UFFS/2026</h5>
          </div>

          <hr style="border:0; border-top: 1.5px solid #00693E; margin:8px 0 10px 0;">

          <div style="background-color:#f9f9f9; padding:8px 10px; border:1px solid #ddd; border-radius:3px; margin-bottom:10px; page-break-inside: avoid;">
            <table style="width:100%; font-size:9.5px; border-collapse:collapse;">
              <tr>
                <td style="padding:2px 0; width:55%;"><strong>Docente:</strong> ${nomeDocente}</td>
                <td style="padding:2px 0; width:45%;"><strong>SIAPE:</strong> ${siape}</td>
              </tr>
              <tr>
                <td style="padding:2px 0;"><strong>Lotação:</strong> ${document.getElementById("lotacao")?.value || "---"}</td>
                <td style="padding:2px 0;"><strong>Regime:</strong> ${document.getElementById("regime")?.value || "---"}</td>
              </tr>
              <tr>
                <td style="padding:2px 0;"><strong>Período Avaliado:</strong> ${document.getElementById("periodo_avaliacao")?.value || "---"}</td>
                <td style="padding:2px 0;"><strong>Data Progressão:</strong> ${document.getElementById("data_progressao")?.value || "---"}</td>
              </tr>
            </table>
          </div>

          ${tabelasGruposHtml}

          <div style="margin-top:15px; page-break-inside: avoid;">
            <div style="padding:8px 12px; background:#e8f5e9; border:1px solid #a5d6a7; border-radius:3px; text-align:right; font-size:11px; color:#004D2D;">
              <strong>PONTUAÇÃO TOTAL FINAL: ${document.getElementById("pontuacao-total-geral")?.innerText || "0.00"} PTS</strong>
            </div>

            <div style="text-align:center; margin-top:35px;">
              <p style="margin:0;">____________________________________________________</p>
              <p style="margin-top:4px; font-weight:bold; font-size:10px;">Assinatura do Docente</p>
            </div>
          </div>
        `;

        document.body.appendChild(ridElement);

        const opt = {
          margin: [8, 8, 8, 8],
          filename: `RID_OFICIAL_${siape}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };

        const ridBuffer = await html2pdf().set(opt).from(ridElement).outputPdf('arraybuffer');
        const pdfRIDDoc = await PDFDocument.load(ridBuffer);
        const paginasRID = await pdfFinal.copyPages(pdfRIDDoc, pdfRIDDoc.getPageIndices());
        paginasRID.forEach(p => pdfFinal.addPage(p));

        for (const item of atividadesOrdenadas) {
          if (item.arquivoPDF) {
            const fileBuffer = await item.arquivoPDF.arrayBuffer();
            try {
              const docAnexo = await PDFDocument.load(fileBuffer);
              const paginasAnexo = await pdfFinal.copyPages(docAnexo, docAnexo.getPageIndices());
              paginasAnexo.forEach(p => pdfFinal.addPage(p));
            } catch (e) {
              console.error("Erro ao mesclar comprovante:", e);
            }
          }
        }

        const pdfBytes = await pdfFinal.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `RID_OFICIAL_${siape}.pdf`;
        link.click();

      } catch (err) {
        alert("Erro ao gerar RID oficial: " + err.message);
      } finally {
        if (ridElement && ridElement.parentNode) {
          ridElement.parentNode.removeChild(ridElement);
        }
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fas fa-file-pdf mr-2"></i>Gerar RID Oficial + Comprovantes PDF`;
        }
      }
    }
  </script>
</body>
</html>
